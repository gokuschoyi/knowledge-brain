services:
  db:
    image: pgvector/pgvector:pg16
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT?POSTGRES_PORT is required}:${POSTGRES_PORT?POSTGRES_PORT is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT?REDIS_PORT is required}:${REDIS_PORT?REDIS_PORT is required}"

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver ${BACKEND_BIND_HOST?BACKEND_BIND_HOST is required}:${BACKEND_PORT?BACKEND_PORT is required}"
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT?BACKEND_PORT is required}:${BACKEND_PORT?BACKEND_PORT is required}"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT?POSTGRES_PORT is required}
      REDIS_URL: redis://redis:${REDIS_PORT?REDIS_PORT is required}/0
      CELERY_BROKER_URL: redis://redis:${REDIS_PORT?REDIS_PORT is required}/0
      CELERY_RESULT_BACKEND: redis://redis:${REDIS_PORT?REDIS_PORT is required}/1
    depends_on:
      - db
      - redis

  celery:
    build: ./backend
    command: celery -A config worker -l info -Q ${CELERY_TASK_DEFAULT_QUEUE?CELERY_TASK_DEFAULT_QUEUE is required}
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT?POSTGRES_PORT is required}
      REDIS_URL: redis://redis:${REDIS_PORT?REDIS_PORT is required}/0
      CELERY_BROKER_URL: redis://redis:${REDIS_PORT?REDIS_PORT is required}/0
      CELERY_RESULT_BACKEND: redis://redis:${REDIS_PORT?REDIS_PORT is required}/1
    depends_on:
      - backend
      - db
      - redis

  celery-ingestion:
    build: ./backend
    command: celery -A config worker -l info -Q ${INGESTION_V2_CHUNK_QUEUE?INGESTION_V2_CHUNK_QUEUE is required} -c ${INGESTION_V2_MAX_PARALLEL_CHUNK_TASKS?INGESTION_V2_MAX_PARALLEL_CHUNK_TASKS is required}
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT?POSTGRES_PORT is required}
      REDIS_URL: redis://redis:${REDIS_PORT?REDIS_PORT is required}/0
      CELERY_BROKER_URL: redis://redis:${REDIS_PORT?REDIS_PORT is required}/0
      CELERY_RESULT_BACKEND: redis://redis:${REDIS_PORT?REDIS_PORT is required}/1
      INGESTION_V2_CHUNK_QUEUE: ${INGESTION_V2_CHUNK_QUEUE?INGESTION_V2_CHUNK_QUEUE is required}
      INGESTION_V2_MAX_PARALLEL_CHUNK_TASKS: ${INGESTION_V2_MAX_PARALLEL_CHUNK_TASKS?INGESTION_V2_MAX_PARALLEL_CHUNK_TASKS is required}
    depends_on:
      - backend
      - db
      - redis

  celery-beat:
    build: ./backend
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT?POSTGRES_PORT is required}
      REDIS_URL: redis://redis:${REDIS_PORT?REDIS_PORT is required}/0
      CELERY_BROKER_URL: redis://redis:${REDIS_PORT?REDIS_PORT is required}/0
      CELERY_RESULT_BACKEND: redis://redis:${REDIS_PORT?REDIS_PORT is required}/1
      AUTO_REPAIR_BEAT_INTERVAL_MINUTES: ${AUTO_REPAIR_BEAT_INTERVAL_MINUTES?AUTO_REPAIR_BEAT_INTERVAL_MINUTES is required}
    depends_on:
      - backend
      - db
      - redis

  frontend:
    build: ./frontend
    command: npm run dev -- --host ${FRONTEND_BIND_HOST?FRONTEND_BIND_HOST is required}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT?FRONTEND_PORT is required}:${FRONTEND_PORT?FRONTEND_PORT is required}"
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL?VITE_API_BASE_URL is required}
    depends_on:
      - backend

volumes:
  postgres_data:
